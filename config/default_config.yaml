# config/default_config.yaml
# Phase 1 - All Numeric AutoML Pipeline Configuration

pipeline:
  name: "Phase1_Numeric_AutoML"
  version: "1.0.0"
  data_type: "numeric_only"
  
  # Data Validation Settings
  validation:
    max_size_gb: 3.0
    min_rows: 50
    min_features: 2
    max_features: 1000
    missing_threshold: 0.5  # Max 50% missing values allowed
    
  # Preprocessing Configuration
  preprocessing:
    outlier_detection:
      methods: ["iqr", "sd3", "percentile"]
      auto_select: true
      iqr_multiplier: 1.5
      std_multiplier: 3.0
      percentile_bounds: [0.01, 0.99]
      
    correlation:
      high_threshold: 0.9     # Remove highly correlated features
      low_threshold: 0.1      # Remove low correlation with target
      method: "pearson"
      
    skewness:
      high_threshold: 1.0     # Highly skewed
      moderate_threshold: 0.5 # Moderately skewed
      transformation_methods: ["log", "sqrt", "boxcox", "yeo-johnson"]
      
    scaling:
      method: "standard"      # standard, robust, minmax
      apply_after_feature_engineering: true

  # Feature Engineering Configuration  
  feature_engineering:
    enabled: true
    
    auto_sklearn:
      enabled: true
      time_budget: 300        # 5 minutes for feature engineering
      memory_limit: 2048      # MB
      include_preprocessors: ["polynomial", "select_percentile"]
      
    polynomial_features:
      enabled: true
      max_degree: 3
      interaction_only: false
      include_bias: false
      
    interaction_features:
      enabled: true
      max_interactions: 2
      
    statistical_features:
      enabled: true
      include_ratios: true
      include_differences: true
      
    feature_selection:
      enabled: true
      method: "auto"          # auto, rfe, select_k_best
      k_best: 20              # if method is select_k_best
      
  # Model Selection & Training
  modeling:
    suggestion_mode: true     # Get smart suggestions
    top_k_models: 3          # Number of suggestions
    run_all_option: true     # Allow users to run all models
    
    # Available models for Phase 1 (Regression)
    available_models:
      linear:
        - "linear_regression"
        - "ridge"
        - "lasso"
        - "elastic_net"
        - "bayesian_ridge"
      tree_based:
        - "decision_tree"
        - "random_forest"
        - "extra_trees"
        - "gradient_boosting"
        - "xgboost"
        - "lightgbm"
      other:
        - "svr"
        - "knn"
        - "neural_network"
        - "gaussian_process"
    
    # Hyperparameter Tuning
    hyperparameter_tuning:
      enabled: true
      method: "random_search"  # grid_search, random_search, bayesian
      cv_folds: 3
      n_iter: 50              # for random search
      scoring: "r2"
      n_jobs: -1
      timeout_per_model: 600  # 10 minutes max per model
      
    # Model Evaluation
    evaluation:
      test_size: 0.2
      cv_folds: 5
      random_state: 42
      scoring_metrics:
        primary: "r2"
        additional: ["mae", "mse", "rmse"]
        
  # Progress Tracking
  progress:
    console_output: true
    log_to_file: true
    detailed_steps: true
    eta_calculation: true
    
  # Storage Settings
  storage:
    base_path: "storage"
    models_path: "storage/models/jobs"
    results_path: "storage/results"
    cache_path: "storage/cache"
    cleanup_old_jobs: true
    max_jobs_to_keep: 50
    
  # Logging Configuration
  logging:
    level: "INFO"            # DEBUG, INFO, WARNING, ERROR
    console_level: "INFO"
    file_level: "DEBUG"
    log_dir: "logs"
    max_file_size_mb: 10
    backup_count: 5

# Model Selection Intelligence Settings
intelligence:
  dataset_profiling:
    size_categories:
      small: [0, 1000]
      medium: [1000, 10000] 
      large: [10000, 100000]
      xlarge: [100000, 1000000]
      
    feature_categories:
      low: [1, 10]
      medium: [10, 50]
      high: [50, 200]
      very_high: [200, 1000]
      
  suggestion_weights:
    performance_history: 0.4
    dataset_similarity: 0.3
    computational_efficiency: 0.2
    model_complexity: 0.1