name: CI for AutoML API

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests (assuming you have some test files)
      - name: Run tests
        run: |
          # You may want to include tests like pytest for Flask routes
          pytest

      # Linting code for consistency
      - name: Lint code
        uses: github/super-linter@v4
        env:
          RUN_LOCAL: false

      # Optionally, deploy if everything passes (if you choose to add deployment later)
      # - name: Deploy
      #   run: |
      #     echo "Deploying API..."
